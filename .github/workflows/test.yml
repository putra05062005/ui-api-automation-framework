name: Automation Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Project
        run: ./gradlew clean build -x test

      - name: Run Web Test
        run: ./gradlew webTest

      - name: Run API Test
        run: ./gradlew apiTest
